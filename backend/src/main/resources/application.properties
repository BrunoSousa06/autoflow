spring.application.name=autoflow
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configurações do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Token JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.public-base-url=http://localhost:8080
app.public-token-secret=dev-local-secret
app.frontend-public-base-url=${FRONTEND_PUBLIC_BASE_URL:http://localhost:4200}
# Projeto acadêmico: o frontend pode ser executado em localhost, Docker ou em
# uma URL temporária de laboratório. Como a API não usa cookies/sessão, CORS
# permanece aberto por padrão e credenciais cross-origin ficam desabilitadas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

management.server.port=8081
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
server.port=8081
