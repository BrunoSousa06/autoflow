name: Pipeline

on:
  push:
    branches: ["develop", "main"]

  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["develop", "main"]

jobs:

  kong-manifest-tests:
    name: Kong Manifest Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate application Kong manifests
        run: bash ./infra/test-kong-manifests.sh

  backend-test-sonar:
    name: Backend Tests & SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=BrunoSousa06_autoflow -Dsonar.qualitygate.wait=true -Dsonar.sources=src/main/java -Dsonar.tests=src/test/java

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload Backend Integration Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-reports
          path: backend/target/failsafe-reports
          if-no-files-found: ignore

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test-sonar

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Backend
        working-directory: backend
        run: mvn package -DskipTests

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm run test:ci

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend
          if-no-files-found: ignore

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@master

      - name: Setup Java
        uses: actions/setup-java@master
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Open Source Scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --sarif-file-output=snyk.sarif

      - name: Build Docker Image for Scan
        working-directory: backend
        run: docker build -t autoflow-app:latest -f Dockerfile .

      - name: Run Snyk Container Scan
        continue-on-error: true
        working-directory: backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test autoflow-app:latest --file=Dockerfile

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:  [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: homolog

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/autoflow-backend:${{ vars.BACKEND_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/autoflow-frontend:${{ vars.FRONTEND_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy-aws:
    name: Deploy AWS with Terraform
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AUTOFLOW_TF_STATE_READY == 'true'
    environment: homolog
    concurrency:
      group: autoflow-application-homolog
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_region_default: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_terraform_state_bucket: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_rds_state_key: ${{ vars.AWS_RDS_STATE_KEY }}
      TF_VAR_enable_kong_ingress: ${{ vars.KONG_INGRESS_ENABLED == 'true' }}
      TF_VAR_kong_lambda_function_name: ${{ vars.KONG_LAMBDA_FUNCTION_NAME }}
      TF_VAR_dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      TF_VAR_backend_image_tag: ${{ vars.BACKEND_IMAGE_TAG }}
      TF_VAR_frontend_image_tag: ${{ vars.FRONTEND_IMAGE_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test AWS account identity guard
        run: python -m unittest discover -s scripts -p "test_verify_aws_account.py" -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Verify expected AWS account
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        run: python scripts/verify_aws_account.py

      - name: Confirmar bucket e state Terraform previamente configurados
        env:
          TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY }}
          RDS_STATE_KEY: ${{ vars.AWS_RDS_STATE_KEY }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          test -n "$RDS_STATE_KEY"
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" > /dev/null

      - name: Configure EKS access
        run: aws eks update-kubeconfig --name eks-autoflow --region "$AWS_REGION"

      - name: Criar ou atualizar Secret da aplicação
        env:
          AUTOFLOW_DB_USERNAME: ${{ secrets.AUTOFLOW_DB_USERNAME }}
          AUTOFLOW_DB_PASSWORD: ${{ secrets.AUTOFLOW_DB_PASSWORD }}
          AUTOFLOW_JWT_SECRET: ${{ secrets.AUTOFLOW_JWT_SECRET }}
          AUTOFLOW_MAIL_PASSWORD: ${{ secrets.AUTOFLOW_MAIL_PASSWORD }}
          AUTOFLOW_PUBLIC_TOKEN_SECRET: ${{ secrets.AUTOFLOW_PUBLIC_TOKEN_SECRET }}
        run: python scripts/apply_k8s_secret.py

      - name: Verificar Kong Gateway, KIC e CRDs
        if: vars.KONG_INGRESS_ENABLED == 'true'
        run: |
          kubectl wait --for=condition=Established --timeout=180s crd/kongplugins.configuration.konghq.com
          kubectl get ingressclass kong
          kubectl wait --for=condition=Ready --timeout=300s pod -l app.kubernetes.io/instance=kong -n kong

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -input=false -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -input=false -auto-approve
  
  create-pr:
    name: Create PR to main
    needs: deploy-aws
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "Criação de PR automatico para main" \
            --body "Um Pull request automatico foi criado para a branch main após o deploy bem-sucedido do Terraform." \
            || echo "PR ja existe e não sera criado."
