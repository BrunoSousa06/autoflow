name: Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test-sonar:
    name: Backend tests and SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: docker info
        name: Verificar Docker para Testcontainers
      - name: Build and test backend, including Flyway integration
        working-directory: backend
        run: mvn -B verify
      - name: SonarQube analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=BrunoSousa06_autoflow -Dsonar.qualitygate.wait=true -Dsonar.sources=src/main/java -Dsonar.tests=src/test/java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/site/jacoco
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend-test-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:ci
      - working-directory: frontend
        run: npm run build
      - name: Testar Nginx, bundles e deep links do gateway
        run: python -m unittest discover -s scripts -p "test_gateway_frontend.py" -v
      - name: Testar aplicação segura do Secret Kubernetes
        run: python -m unittest discover -s scripts -p "test_apply_k8s_secret.py" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend
          if-no-files-found: ignore

  terraform-static:
    name: Terraform formatting and static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Verificar formatação Terraform
        run: terraform fmt -check -recursive infra
      - name: Validar configuração em backend isolado
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

  snyk-scan:
    name: Snyk security scan
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
      - name: Snyk Open Source scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --sarif-file-output=snyk.sarif
      - name: Build backend image for container scan
        run: docker build --file backend/Dockerfile --tag autoflow-backend:${{ github.sha }} backend
      - name: Snyk container scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test autoflow-backend:${{ github.sha }} --file=backend/Dockerfile

  docker-publish:
    name: Publish immutable images to Docker Hub
    runs-on: ubuntu-latest
    needs: [backend-test-sonar, frontend-test-build, terraform-static, snyk-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Publicar imagem backend vinculada ao commit
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/autoflow-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Publicar imagem frontend vinculada ao commit
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/autoflow-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deployment-blocked-private-eks:
    name: Homologação bloqueada — acesso privado ao EKS
    runs-on: ubuntu-latest
    needs: [docker-publish]
    if: always() && github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Bloquear antes de Terraform/Kubernetes
        run: |
          echo "Deploy bloqueado com segurança: o runner GitHub-hosted não tem rota de rede autorizada para a API Kubernetes privada/restrita do EKS eks-autoflow."
          echo "Não executar terraform plan/apply nem kubectl neste runner. update-kubeconfig apenas configura credenciais e não cria conectividade de rede."
          echo "Consulte .github/CI-CD-AWS.md para provisionar e validar um runner efêmero privado antes de habilitar o gate."
          exit 1
