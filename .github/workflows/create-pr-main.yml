name: PR automatico para main 

on:
  push:
    branches:
      - homolog

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR to Main
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head homolog \
            --title "Criação de PR automatico para main" \
            --body "Um Pull request automatico foi criado para a branch main." \
            || echo "PR ja existe e não sera criado."