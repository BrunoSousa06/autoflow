name: Pipeline

on:
  push:

  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["develop"]

jobs:

  backend-test-sonar:
    name: Backend Tests & SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=BrunoSousa06_autoflow \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload Backend Integration Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-reports
          path: backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm run test:ci

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend
          if-no-files-found: ignore

  create-pr-to-develop:
    name: Create PR to Develop
    runs-on: ubuntu-latest

    needs:
      - backend-test-sonar
      - frontend-test

    if: |
      github.event_name == 'push' &&
      github.ref != 'refs/heads/develop' &&
      github.ref != 'refs/heads/main'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check Existing Pull Request
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list \
            --base develop \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number \
            --jq 'length')

          echo "count=$PR_COUNT" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check-pr.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ github.ref_name }}" \
            --title "Merge ${GITHUB_REF_NAME} into develop" \
            --body "PR criado automaticamente após os testes da branch ${GITHUB_REF_NAME} passarem com sucesso."