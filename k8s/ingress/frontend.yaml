apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autoflow-frontend
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autoflow-frontend-internal
                port:
                  number: 80
